<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Avery Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body class="page-contact">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-name">avery lane</span>
        <span class="brand-title">Product Designer | UX | UI | Researcher | Creative Thinker</span>
      </a>
      <nav class="site-nav">
        <a href="index.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="wrap">
      <h1>Get in touch</h1>
      <p class="signoff">Let's create magic together!</p>
      <form class="contact-form">
        <div class="field">
          <input type="text" placeholder="Your name" />
        </div>
        <div class="field">
          <input type="text" placeholder="Your email" />
        </div>
        <div class="field">
          <input type="text" placeholder="Company / project" />
        </div>
        <div class="field">
          <textarea placeholder="Tell me about your vision..."></textarea>
        </div>
        <button class="btn" type="submit">Send good vibes</button>
        <p class="form-note muted"></p>
      </form>
    </div>

    <footer class="site-footer">
      <span>© 2026 Avery Lane</span>
      <span>Let's create magic together!</span>
    </footer>
    <script src="js/site.js"></script>
  </body>
</html>
