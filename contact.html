<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Alex Morgan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body class="page-contact">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-name">Alex Morgan</span>
        <span class="brand-title">Product Designer</span>
      </a>
      <nav class="site-nav">
        <a href="index.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="wrap">
      <h1>Contact</h1>
      <p class="signoff">I'd love to connect.</p>
      <p class="muted" style="margin: -20px 0 28px;">
        I'm currently open to new opportunities and always happy to chat about product design.
      </p>
      <form class="contact-form">
        <div class="field">
          <input type="text" placeholder="Name" />
        </div>
        <div class="field">
          <input type="text" placeholder="Email" />
        </div>
        <div class="field">
          <textarea placeholder="Message"></textarea>
        </div>
        <button class="btn" type="submit">Send</button>
        <p class="form-note muted"></p>
      </form>
    </div>

    <footer class="site-footer">
      <span>© 2026 Alex Morgan</span>
      <span>Open to new opportunities</span>
    </footer>
    <script src="js/site.js"></script>
  </body>
</html>
